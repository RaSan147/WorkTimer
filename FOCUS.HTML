<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer</title>
    <style>
        :root {
            --bg-color: #f0f0f5;
            --container-bg: rgba(255, 255, 255, 0.6);
            --text-color: #1d1d1f;
            --primary-color: #007aff;
            --secondary-color: #e5e5ea;
            --secondary-text: #6e6e73;
            --danger-color: #ff3b30;
            --shadow-color: rgba(0, 0, 0, 0.08);
            --primary-hover-shadow: rgba(0, 122, 255, 0.2);
            --danger-hover-shadow: rgba(255, 59, 48, 0.2);
            --border-color: rgba(0, 0, 0, 0.1);
            --transition-speed: 0.4s;
        }

        body.dark-mode {
            --bg-color: #1d1d1f;
            --container-bg: rgba(44, 44, 46, 0.7);
            --text-color: #f5f5f7;
            --primary-color: #0a84ff;
            --secondary-color: #3a3a3c;
            --secondary-text: #8e8e93;
            --danger-color: #ff453a;
            --shadow-color: rgba(0, 0, 0, 0.25);
            --primary-hover-shadow: rgba(0, 122, 255, 0.2);
            --danger-hover-shadow: rgba(255, 69, 58, 0.25);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease;
            color-scheme: light dark;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            box-sizing: border-box;
            width: min(500px, 92%);
            padding: 2rem;
            background: var(--container-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 12px 40px -12px var(--shadow-color);
            transition: background-color var(--transition-speed) ease, border-color var(--transition-speed) ease;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        #status {
            font-size: 1.75rem;
            font-weight: 600;
            margin: 0;
            color: var(--text-color);
            transition: color var(--transition-speed) ease;
        }

        #darkModeToggle {
            background: transparent;
            border: none;
            color: var(--secondary-text);
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: color 0.2s, background-color 0.2s;
        }
        #darkModeToggle:hover {
            color: var(--text-color);
            background-color: var(--secondary-color);
        }
        .dark-mode #darkModeToggle .sun-icon { display: block; }
        .dark-mode #darkModeToggle .moon-icon { display: none; }
        #darkModeToggle .sun-icon { display: none; }

        #timer {
            font-size: clamp(4rem, 15vw, 7rem);
            font-weight: 700;
            line-height: 1;
            margin: 0;
            color: var(--text-color);
            transition: color var(--transition-speed) ease;
            font-variant-numeric: tabular-nums;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            width: 100%;
        }

        .controls button {
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background-color: var(--primary-color);
            border: none;
            border-radius: 12px;
            padding: 0.8rem 0;
            flex-grow: 1;
            flex-basis: 0;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease, background-color var(--transition-speed) ease, color var(--transition-speed) ease, opacity 0.2s ease;
        }

        /* 'Start' / 'Resume' button state */
        .controls button.primary {
            background-color: var(--primary-color);
            color: white;
        }
        .controls button.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px var(--primary-hover-shadow);
        }

        /* 'Reset' button state */
        .controls button.secondary {
            background-color: var(--secondary-color);
            color: var(--secondary-text);
        }
        .controls button.secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px var(--shadow-color);
        }
        
        /* 'Pause' button state */
        .controls button.danger {
            background-color: var(--danger-color);
            color: white;
        }
        .controls button.danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px var(--danger-hover-shadow);
        }

        /* Disabled state for buttons */
        .controls button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
         .controls button:disabled:hover {
            transform: none;
            box-shadow: none;
        }
        
        .settings {
            width: 100%;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
            margin-top: 0.5rem;
            display: grid;
            grid-template-columns: repeat(2, minmax(140px, 1fr));
            gap: 1.5rem 1rem;
            transition: border-color var(--transition-speed) ease;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .settings label {
            font-weight: 500;
            color: var(--secondary-text);
            transition: color var(--transition-speed) ease;
        }

        .settings input[type="number"] {
            width: 4rem;
            font-size: 1rem;
            font-weight: 500;
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            background-color: transparent;
            color: var(--text-color);
            border-radius: 8px;
            text-align: center;
            transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease, border-color var(--transition-speed) ease;
        }
        .settings input[type="number"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2);
        }

        @media (max-width: 480px) {
            .container {
                gap: 1rem;
                padding: 1.5rem;
                border-radius: 20px;
            }
            #status { font-size: 1.5rem; }
            .settings { grid-template-columns: 1fr; }
            .setting-group { width: 100%; align-items: center; }
            .input-row { width: 100%; justify-content: space-between; max-width: 260px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 id="status">Study Session</h1>
        <button id="darkModeToggle" aria-label="Toggle Dark Mode">
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM12 15c-1.65 0-3-1.35-3-3s1.35-3 3-3 3 1.35 3 3-1.35 3-3 3zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
            </svg>
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.64-.11 2.4-.31-.3-.28-.57-.6-.8-.95-.83-1.27-1.2-2.77-1.2-4.34 0-3.73 2.93-6.8 6.6-7.02.33-.01.65.01.98.05C19.1 5.64 15.88 3 12 3zm-1.29 12.27c.01.01 0 0 0 0z"/>
            </svg>
        </button>
    </div>

    <div id="timer">45:00</div>

    <div class="controls">
        <button id="resetBtn" class="secondary" disabled>Reset</button>
        <button id="startPauseBtn" class="primary">Start</button>
    </div>

    <div class="settings">
        <div class="setting-group">
            <div class="input-row">
                <label for="study-minutes">Study</label>
                <input type="number" id="study-minutes" value="45" min="0" step="any">
                <span>min</span>
            </div>
        </div>
        <div class="setting-group">
            <div class="input-row">
                <label for="break-minutes">Break</label>
                <input type="number" id="break-minutes" value="15" min="0" step="any">
                <span>min</span>
            </div>
        </div>
    </div>
</div>

<script>
    // --- SCRIPT START ---
    const body = document.body;
    const darkModeToggle = document.getElementById('darkModeToggle');
    const statusDisplay = document.getElementById('status');
    const timerDisplay = document.getElementById('timer');
    
    const startPauseBtn = document.getElementById('startPauseBtn');
    const resetBtn = document.getElementById('resetBtn');

    const studyMinutesInput = document.getElementById('study-minutes');
    const breakMinutesInput = document.getElementById('break-minutes');

    let timerInterval = null;
    // totalSeconds always represents the currently-displayed remaining whole seconds
    let totalSeconds = studyMinutesInput.value * 60;
    // endTimestamp is the target time (ms since epoch) when the running timer will hit zero
    let endTimestamp = null;
    const TICK_INTERVAL_MS = 500; // UI refresh interval (keeps updates responsive without being wasteful)
    let isStudyTime = true;
    let isPaused = true;
    const DEFAULT_VOLUME = 1.0;
    const AUDIO_BOOST = 4.0; 

    // --- DARK MODE LOGIC ---
    const htmlEl = document.documentElement;
    function applyDarkModeClass(shouldAdd) {
        body.classList.toggle('dark-mode', shouldAdd);
        htmlEl.classList.toggle('dark-mode', shouldAdd);
    }

    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = savedTheme ? savedTheme === 'dark' : prefersDark;
    applyDarkModeClass(isDark);

    darkModeToggle.addEventListener('click', () => {
        const willBeDark = !body.classList.contains('dark-mode');
        applyDarkModeClass(willBeDark);
        localStorage.setItem('theme', willBeDark ? 'dark' : 'light');
    });


    // --- AUDIO DING ---
    let audioContext;

    const WORK_START_URL = 'https://cdn.jsdelivr.net/gh/RaSan147/WorkTimer@27c21bb21fc01b9d6ec40d91ed24f9c2f00dac30/back2desk.mp3';
    const REST_START_URL = 'https://cdn.jsdelivr.net/gh/RaSan147/WorkTimer@27c21bb21fc01b9d6ec40d91ed24f9c2f00dac30/getRest.mp3'; 

    let studyStartAudioEl = null;
    let restStartAudioEl = null;
    let htmlAudioUnlocked = false;
    let htmlGainNode = null; 
    let studyStartSource = null;
    let restStartSource = null;

    function ensureHtmlAudioElements() {
        try {
            if (!studyStartAudioEl) {
                studyStartAudioEl = new Audio(WORK_START_URL);
                studyStartAudioEl.preload = 'auto';
                studyStartAudioEl.crossOrigin = 'anonymous';
                studyStartAudioEl.volume = DEFAULT_VOLUME;
            }
            if (!restStartAudioEl) {
                restStartAudioEl = new Audio(REST_START_URL);
                restStartAudioEl.preload = 'auto';
                restStartAudioEl.crossOrigin = 'anonymous';
                restStartAudioEl.volume = DEFAULT_VOLUME;
            }
        } catch (e) {
            console.warn("Error creating Audio elements. Offline sounds will be used.", e);
            studyStartAudioEl = null;
            restStartAudioEl = null;
        }

        if (audioContext && htmlGainNode === null) {
            htmlGainNode = audioContext.createGain();
            htmlGainNode.gain.value = AUDIO_BOOST; 
            htmlGainNode.connect(audioContext.destination);
        }

        try {
            if (audioContext && studyStartAudioEl && !studyStartSource) {
                studyStartSource = audioContext.createMediaElementSource(studyStartAudioEl);
                studyStartSource.connect(htmlGainNode);
            }
            if (audioContext && restStartAudioEl && !restStartSource) {
                restStartSource = audioContext.createMediaElementSource(restStartAudioEl);
                restStartSource.connect(htmlGainNode);
            }
        } catch (e) {
            console.warn('Could not route HTMLAudio through AudioContext:', e);
            studyStartSource = null; 
            restStartSource = null; 
        }
    }

    function attemptUnlockHtmlAudio() {
        if (htmlAudioUnlocked || !studyStartAudioEl) return; 
        
        const tryUnlock = (el) => {
            if (!el) return Promise.resolve();
            const prevVol = el.volume;
            el.volume = 0; 
            return el.play().then(() => {
                el.pause();
                el.currentTime = 0;
                el.volume = prevVol;
            }).catch(() => {
                el.volume = prevVol;
            });
        };
        Promise.all([tryUnlock(studyStartAudioEl), tryUnlock(restStartAudioEl)]).finally(() => {
            htmlAudioUnlocked = true;
        });
    }

    function playDing() {
        if (!audioContext) {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
                console.error("AudioContext not supported.", e);
                return;
            }
        }
        if (audioContext.state === 'suspended') audioContext.resume();

        if (htmlGainNode === null) {
             htmlGainNode = audioContext.createGain();
             htmlGainNode.gain.value = AUDIO_BOOST; 
             htmlGainNode.connect(audioContext.destination);
        }

        const t0 = audioContext.currentTime;
        const master = audioContext.createGain();
        master.gain.setValueAtTime(0, t0);
        master.gain.linearRampToValueAtTime((DEFAULT_VOLUME || 1) * 0.5, t0 + 0.05); 
        master.connect(htmlGainNode); 

        const fundamental = 440; 
        const partials = [
            fundamental * 0.5, // G3
            fundamental,       // G4
            fundamental * 1.5, // D5
            fundamental * 2,   // G5
            fundamental * 2.5  // B5
        ];
        const partialGains = [0.6, 1, 0.7, 0.4, 0.3]; 

        partials.forEach((freq, i) => {
            const osc = audioContext.createOscillator();
            osc.type = 'sine';
            osc.frequency.value = freq;
            osc.detune.value = i > 0 ? (Math.random() - 0.5) * 8 : 0;

            const env = audioContext.createGain();
            const attackTime = 0.015;
            const decayTime = 1.8 + (Math.random() * 0.4); 

            env.gain.setValueAtTime(0, t0);
            env.gain.linearRampToValueAtTime(partialGains[i], t0 + attackTime);
            env.gain.exponentialRampToValueAtTime(0.0001, t0 + decayTime);

            osc.connect(env);
            env.connect(master);

            osc.start(t0);
            osc.stop(t0 + decayTime + 0.1);
        });

        master.gain.setTargetAtTime(0.00001, t0 + 1.5, 0.5);
    }

    async function playTransitionSound(nextIsStudyPhase) {
        if (!audioContext) {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) { /* fail silently */ }
        }

        ensureHtmlAudioElements(); 
        
        const el = nextIsStudyPhase ? studyStartAudioEl : restStartAudioEl;

        if (!el) {
            console.warn('HTMLAudio element not available. Falling back to synth ding.');
            playDing();
            return;
        }

        try {
            el.currentTime = 0;
            await el.play();
        } catch (e) {
            console.warn('HTMLAudio playback failed. Falling back to synth ding.', e);
            playDing();
        }
    }

    function updateDisplay() {
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        const formattedTime = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        timerDisplay.textContent = formattedTime;
        document.title = `${formattedTime} - ${isStudyTime ? 'Study' : 'Break'}`;
    }

    function updatePhaseUI() {
        statusDisplay.textContent = isStudyTime ? 'Study Session' : 'Take a Break';
    }

    let initialStudySeconds = studyMinutesInput.value * 60;
    let initialBreakSeconds = breakMinutesInput.value * 60;

    function startTimer() {
        // If starting fresh or resuming from a completed/cleared state, set remaining seconds
        if (isPaused && (totalSeconds === null || totalSeconds <= 0 || totalSeconds === initialStudySeconds || totalSeconds === initialBreakSeconds)) {
            totalSeconds = (isStudyTime ? studyMinutesInput.value : breakMinutesInput.value) * 60;
        }

        isPaused = false;

        resetBtn.disabled = false;
        startPauseBtn.textContent = 'Pause';
        startPauseBtn.classList.remove('primary');
        startPauseBtn.classList.add('danger');

        // If an interval is already running, no need to start another
        if (timerInterval) return;

        // Compute the end timestamp based on remaining seconds
        endTimestamp = Date.now() + (totalSeconds * 1000);

        const tick = () => {
            const remainingMs = endTimestamp - Date.now();
            const remainingSec = Math.max(0, Math.round(remainingMs / 1000));
            totalSeconds = remainingSec;
            updateDisplay();

            if (remainingSec <= 0) {
                // Stop current interval
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }

                // Determine what phase just ended
                const endedWasStudy = isStudyTime;

                // Transition to next phase and play appropriate sound
                const nextIsStudy = !isStudyTime;
                playTransitionSound(nextIsStudy);

                isStudyTime = nextIsStudy;
                updatePhaseUI();
                totalSeconds = (isStudyTime ? studyMinutesInput.value : breakMinutesInput.value) * 60;
                updateDisplay();

                // Decide if we should auto-start the next phase
                // Rule: Breaks are manual unless the just-ended Study duration was 0.
                let shouldAutoStart = false;
                if (!isStudyTime) {
                    // We are about to start a Break
                    const configuredStudyMinutes = Number(studyMinutesInput.value) || 0;
                    shouldAutoStart = configuredStudyMinutes === 0;
                } else {
                    // We are about to start a Study after Break -> manual by default
                    shouldAutoStart = false;
                }

                if (shouldAutoStart && totalSeconds > 0) {
                    isPaused = false;
                    startPauseBtn.textContent = 'Pause';
                    startPauseBtn.classList.remove('primary');
                    startPauseBtn.classList.add('danger');
                    endTimestamp = Date.now() + (totalSeconds * 1000);
                    // Start ticking for the next phase
                    timerInterval = setInterval(tick, TICK_INTERVAL_MS);
                } else {
                    // Stay paused, let user start manually
                    isPaused = true;
                    startPauseBtn.textContent = 'Start';
                    startPauseBtn.classList.remove('danger');
                    startPauseBtn.classList.add('primary');
                    endTimestamp = null;
                }
            }
        };

        // Schedule periodic UI refreshes, then run an immediate tick.
        // Creating the interval first ensures that a zero-duration phase can clear it safely.
        timerInterval = setInterval(tick, TICK_INTERVAL_MS);
        tick();
    }

    // When the page becomes visible again, force an immediate tick so the UI catches up
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
            // If running, tick immediately to refresh display
            if (!isPaused && endTimestamp !== null) {
                const remainingMs = endTimestamp - Date.now();
                const remainingSec = Math.max(0, Math.round(remainingMs / 1000));
                totalSeconds = remainingSec;
                updateDisplay();
            }
        }
    });

    function pauseTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        // Recompute remaining seconds from endTimestamp so we preserve precise remaining time
        if (endTimestamp !== null) {
            totalSeconds = Math.max(0, Math.round((endTimestamp - Date.now()) / 1000));
            endTimestamp = null;
        }

        isPaused = true;

        // Set button to 'Resume' (primary state)
        startPauseBtn.textContent = 'Resume';
        startPauseBtn.classList.remove('danger');
        startPauseBtn.classList.add('primary');
        resetBtn.disabled = false;
    }

    function resetTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        isPaused = true;
        isStudyTime = true;
        initialStudySeconds = studyMinutesInput.value * 60;
        initialBreakSeconds = breakMinutesInput.value * 60;
        totalSeconds = initialStudySeconds;
        endTimestamp = null;
        updatePhaseUI();
        updateDisplay();

        // Reset buttons to initial state
        resetBtn.disabled = true;
        startPauseBtn.textContent = 'Start';
        startPauseBtn.classList.remove('danger');
        startPauseBtn.classList.add('primary');
    }

    startPauseBtn.addEventListener('click', () => {
        if (!audioContext) {
             try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
                console.error("AudioContext not supported.", e);
            }
        }
        if (audioContext && audioContext.state === 'suspended') audioContext.resume();
        ensureHtmlAudioElements();
        attemptUnlockHtmlAudio();

        if (isPaused) {
            startTimer(); 
        } else {
            pauseTimer();
        }
    });

    resetBtn.addEventListener('click', resetTimer);

    studyMinutesInput.addEventListener('change', () => {
        if (isPaused && isStudyTime) {
            resetTimer();
        } else {
            initialStudySeconds = studyMinutesInput.value * 60;
        }
    });

    breakMinutesInput.addEventListener('change', () => {
        if (isPaused && !isStudyTime) {
            totalSeconds = breakMinutesInput.value * 60;
            initialBreakSeconds = totalSeconds;
            updateDisplay();
        } else {
            initialBreakSeconds = breakMinutesInput.value * 60;
        }
    });

    // Initialize display on load
    updatePhaseUI();
    updateDisplay();
</script>

</body>
</html>
